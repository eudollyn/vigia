<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vigia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060b; --txt:#f4f1ea; --sub:#9aa0b4; --ouro:#ffd9a0; --ouro2:#ffb35c;
  --azul:#7cc4ff; --verde:#6fe3a5; --verm:#ff8a7a; --vidro:rgba(255,255,255,.06); --borda:rgba(255,255,255,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"Inter Tight",system-ui,sans-serif;overflow:hidden}
canvas#ceu{position:fixed;inset:0;width:100%;height:100%;display:block}
.cena{position:relative;z-index:2;height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:22px 28px}
/* topo */
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.marca{font-weight:800;letter-spacing:.02em;font-size:18px;display:flex;align-items:center;gap:10px}
.marca i{width:10px;height:10px;border-radius:50%;background:var(--ouro);box-shadow:0 0 14px var(--ouro2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;padding:7px 12px;border-radius:999px;background:var(--vidro);border:1px solid var(--borda);backdrop-filter:blur(8px);color:var(--sub);display:flex;align-items:center;gap:7px;transition:.4s}
.chip b{width:7px;height:7px;border-radius:50%;background:#555}
.chip.ok{color:var(--txt)} .chip.ok b{background:var(--verde);box-shadow:0 0 10px var(--verde)}
.chip.mal b{background:var(--verm);box-shadow:0 0 10px var(--verm)}
.chip.ouvindo b{background:var(--azul);box-shadow:0 0 12px var(--azul);animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.3}}
/* centro */
.centro{display:grid;place-items:center;text-align:center;align-content:center;gap:4px;padding-top:10vh}
.hora{font-weight:800;font-size:clamp(72px,14vw,190px);line-height:.9;letter-spacing:-.04em;
  background:linear-gradient(180deg,#fff 30%,#c9c3b6);-webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;transform:translateY(24px);animation:sobe 1.2s .2s cubic-bezier(.2,.8,.2,1) forwards}
.saud{font-size:clamp(20px,2.6vw,34px);font-weight:600;color:var(--ouro);opacity:0;transform:translateY(16px);animation:sobe 1.2s .5s cubic-bezier(.2,.8,.2,1) forwards}
.data{font-size:15px;color:var(--sub);letter-spacing:.08em;text-transform:uppercase;margin-top:6px;opacity:0;animation:sobe 1.2s .8s forwards}
@keyframes sobe{to{opacity:1;transform:none}}
.estado{margin-top:22px;font-size:16px;color:var(--sub);min-height:24px;transition:color .4s}
.estado.falando{color:var(--ouro)} .estado.ouvindo{color:var(--azul)} .estado.cmd{color:var(--verde)}
/* avisos */
.base{display:flex;justify-content:center}
.lista{width:min(720px,100%);display:flex;flex-direction:column;gap:8px}
.aviso{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;
  background:var(--vidro);border:1px solid var(--borda);backdrop-filter:blur(10px);animation:entra .7s cubic-bezier(.2,.8,.2,1) both}
.aviso .ic{font-size:18px} .aviso .q{font-weight:600} .aviso .r{color:var(--sub);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aviso .h{color:var(--sub);font-size:12px} .aviso.urg{border-color:rgba(255,138,122,.5)}
@keyframes entra{from{opacity:0;transform:translateY(14px) scale(.98)}}
/* interações: só o que é clicável recebe o mouse; o resto deixa passar para o céu */
.cena{pointer-events:none} .chips,.hora,.dock,.lista{pointer-events:auto}
.chip{cursor:default} .chip:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.3);color:var(--txt)}
.hora{cursor:default;transition:letter-spacing .6s cubic-bezier(.2,.8,.2,1),filter .6s}
.hora:hover{letter-spacing:-.02em;filter:drop-shadow(0 0 24px rgba(255,217,160,.35))}
.pilha{width:min(720px,100%);display:flex;flex-direction:column;gap:14px;align-items:center}
.dock{display:flex;gap:12px;justify-content:center}
.mag{position:relative;overflow:hidden;font:600 15px "Inter Tight",system-ui;color:var(--txt);padding:12px 20px;border-radius:999px;cursor:pointer;
  background:var(--vidro);border:1px solid var(--borda);backdrop-filter:blur(10px);transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s;
  --p:0;isolation:isolate;touch-action:none;user-select:none}
.mag:hover{border-color:rgba(255,217,160,.55);box-shadow:0 0 28px rgba(255,179,92,.25)}
.mag:active{transform:scale(.96)!important}
.mag small{opacity:.55;font-weight:400;margin-left:4px}
.mag::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;
  background:linear-gradient(90deg,rgba(255,179,92,.55) calc(var(--p)*100%),transparent calc(var(--p)*100%))}
.mag.feito{border-color:var(--verde);box-shadow:0 0 30px rgba(111,227,165,.4)}
.mag.on{border-color:#c79bff;color:#fff;background:rgba(160,110,255,.22);box-shadow:0 0 30px rgba(170,120,255,.45)}
.mag.on::after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#c79bff;animation:pisca 1.2s infinite}
.chip.musica b{background:#c79bff;box-shadow:0 0 10px #c79bff}
/* cartões com holofote que segue o cursor */
.aviso{position:relative;overflow:hidden;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .35s,background .35s}
.aviso::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .35s;pointer-events:none;
  background:radial-gradient(260px circle at var(--x,50%) var(--y,50%),rgba(255,217,160,.24),transparent 60%)}
.aviso::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;opacity:0;transition:opacity .35s;pointer-events:none;
  background:radial-gradient(200px circle at var(--x,50%) var(--y,50%),rgba(255,217,160,.8),transparent 60%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.aviso:hover{transform:translateY(-3px)} .aviso:hover::before,.aviso:hover::after{opacity:1}
.aviso.aberto .r{white-space:normal;color:var(--txt)}
.dica{position:fixed;left:50%;top:calc(19vh + 68px);transform:translate(-50%,6px);z-index:3;font-size:13px;color:var(--txt);padding:6px 12px;border-radius:999px;
  background:rgba(0,0,0,.55);border:1px solid var(--borda);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
.dica.mostra{opacity:1;transform:translate(-50%,0)}
/* abertura */
.abrir{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(5,6,11,.82),rgba(5,6,11,.97));backdrop-filter:blur(14px);transition:opacity .8s}
.abrir.some{opacity:0;pointer-events:none}
.abrir .caixa{text-align:center;padding:24px}
.abrir h1{font-size:clamp(34px,6vw,64px);margin:0 0 10px;font-weight:800;letter-spacing:-.03em}
.abrir p{color:var(--sub);margin:0 0 28px}
.btn{font:600 17px "Inter Tight",system-ui;padding:16px 30px;border-radius:999px;border:0;cursor:pointer;color:#1a1206;
  background:linear-gradient(90deg,var(--ouro),var(--ouro2));box-shadow:0 0 40px rgba(255,179,92,.45);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 0 60px rgba(255,179,92,.7)}
@media (max-width:600px){.cena{padding:16px}.aviso{grid-template-columns:auto 1fr}.aviso .h{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="ceu"></canvas>

<div class="cena">
  <header class="topo">
    <div class="marca"><i></i>VIGIA</div>
    <div class="chips">
      <span class="chip" id="cConex"><b></b>PC</span>
      <span class="chip" id="cMic"><b></b>Microfone</span>
      <span class="chip" id="cCmd"><b></b>Comandos</span>
    </div>
  </header>

  <main class="centro">
    <div class="hora" id="hora">--:--</div>
    <div class="saud" id="saud">Olá</div>
    <div class="data" id="data"></div>
    <div class="estado" id="estado">Esperando mensagens…</div>
  </main>

  <footer class="base">
    <div class="pilha">
      <div class="dock">
        <button class="mag" id="bResp" title="Responder a última mensagem do WhatsApp por voz">💬 Responder</button>
        <button class="mag" id="bMusica" title="Liga com música tocando: pausa os comandos de voz contínuos, deixa a voz mais alta e adapta a gravação ao som da música">🎵 Modo música</button>
        <button class="mag segurar" id="bTchau" title="Segure para desligar o PC">🌙 Até amanhã <small>segure</small></button>
      </div>
      <div class="lista" id="lista"></div>
    </div>
  </footer>
</div>
<div class="dica" id="dica">Clique para responder a última mensagem</div>

<div class="abrir" id="abrir">
  <div class="caixa">
    <h1>Vigia</h1>
    <p>Mensagens, voz e comandos neste notebook.</p>
    <button class="btn" id="b">Ativar som e microfone</button>
  </div>
</div>

<script>
const k = new URLSearchParams(location.search).get('k');
const $ = (id) => document.getElementById(id);
let NOME = '';

/* ---------------- relógio e saudação ---------------- */
function relogio(){
  const d = new Date(), h = d.getHours();
  $('hora').textContent = d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  $('saud').textContent = (h<12?'Bom dia':h<18?'Boa tarde':'Boa noite') + (NOME?', '+NOME:'');
  $('data').textContent = d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
}
relogio(); setInterval(relogio, 5000);

/* ---------------- céu animado ---------------- */
const cv = $('ceu'), cx = cv.getContext('2d');
let W, H, DPR, estrelas = [], arco = [];
const anima = { nivel: 0, alvo: 0, modo: 'calmo' };   // nivel = intensidade da voz/microfone (0..1)
const mouse = { x: 0, y: 0, on: false }, rastro = [], faiscas = [], orbe = { x:0, y:0, r:0, zoom:1, sobre:false };
addEventListener('pointermove', e => { mouse.x = e.clientX*DPR; mouse.y = e.clientY*DPR; mouse.on = true; });
document.documentElement.addEventListener('pointerleave', () => { mouse.on = false; });
function explodir(x, y, n=46, cores=['#ffd9a0','#ffb35c','#fff']){
  for (let i=0;i<n;i++){ const a=Math.random()*6.283, v=(1+Math.random()*4)*DPR;
    faiscas.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - DPR, vida: 1, r: (1+Math.random()*2.2)*DPR, cor: cores[i%cores.length] }); } }
// clique: na esfera = responder a última mensagem; no céu = faíscas
addEventListener('click', e => {
  if (e.target.closest('button,.aviso,.chip,.dock,.abrir')) return;
  const x=e.clientX*DPR, y=e.clientY*DPR;
  if (orbe.sobre){ explodir(x, y, 70, ['#ff6ec8','#5aaaff','#50f0dc','#fff']); comando('responda','responda'); }
  else explodir(x, y);
});
function tamanho(){
  DPR = Math.min(2, devicePixelRatio || 1);
  W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR;
  estrelas = Array.from({length: Math.round(innerWidth*innerHeight/2600)}, () => { const x=Math.random()*W, y=Math.random()*H; return {
    x, y, hx: x, hy: y, vx: 0, vy: 0, r: (Math.random()**3*1.6+.3)*DPR,
    f: Math.random()*6.28, v: .4+Math.random()*1.4, d: (Math.random()-.5)*.06*DPR }; });
  arco = Array.from({length: 520}, () => ({ t: Math.random(), o: (Math.random()-.5), s: .0006+Math.random()*.0016, r: (Math.random()*1.3+.3)*DPR, f: Math.random()*6.28 }));
}
addEventListener('resize', tamanho); tamanho();
// curva do arco (passa por baixo da esfera, como um rastro)
function curva(t){
  const x0=W*.06, y0=H*.62, x1=W*.45, y1=H*1.02, x2=W*.98, y2=H*.5;
  const u=1-t; return [u*u*x0+2*u*t*x1+t*t*x2, u*u*y0+2*u*t*y1+t*t*y2];
}
const COR = { calmo:[255,217,160], falando:[255,200,120], ouvindo:[124,196,255], cmd:[111,227,165] };
let corAtual = [255,217,160];
function quadro(ms){
  const tempo = ms/1000;
  anima.nivel += (anima.alvo - anima.nivel) * .18;
  const alvoCor = COR[anima.modo] || COR.calmo;
  corAtual = corAtual.map((c,i)=> c + (alvoCor[i]-c)*.05);
  const [R,G,B] = corAtual.map(Math.round);
  cx.clearRect(0,0,W,H);
  // brilho de fundo
  const ex = W*.5, ey = H*.36;
  const g = cx.createRadialGradient(ex,ey,0,ex,ey,Math.max(W,H)*.55);
  g.addColorStop(0,`rgba(${R},${G},${B},${.10+anima.nivel*.12})`); g.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle = g; cx.fillRect(0,0,W,H);
  // estrelas que piscam, derivam e FOGEM do cursor (voltam ao lugar quando ele sai)
  const RAIO_M = 140*DPR;
  for (const s of estrelas){
    s.hx += s.d; if (s.hx<0) { s.hx=W; s.x=W; } if (s.hx>W) { s.hx=0; s.x=0; }
    if (mouse.on){ const dx=s.x-mouse.x, dy=s.y-mouse.y, dist=Math.hypot(dx,dy);
      if (dist < RAIO_M && dist > 0.1){ const f=(1-dist/RAIO_M)*2.4; s.vx += dx/dist*f; s.vy += dy/dist*f; } }
    s.vx += (s.hx-s.x)*.018; s.vy += (s.hy-s.y)*.018; s.vx *= .86; s.vy *= .86; s.x += s.vx; s.y += s.vy;
    const perto = mouse.on ? Math.max(0, 1-Math.hypot(s.x-mouse.x, s.y-mouse.y)/(RAIO_M*1.6)) : 0;
    const a = Math.min(1, .35 + .65*Math.abs(Math.sin(tempo*s.v + s.f)) + perto*.6);
    cx.globalAlpha = a; cx.fillStyle = '#fff';
    cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.283); cx.fill();
    if (s.r > 1.5*DPR && a > .9){ cx.globalAlpha = a*.5; cx.fillRect(s.x-s.r*5, s.y-.4*DPR, s.r*10, .8*DPR); cx.fillRect(s.x-.4*DPR, s.y-s.r*5, .8*DPR, s.r*10); }
  }
  // arco de partículas fluindo (mais rápido quando ela fala)
  const vel = 1 + anima.nivel*5;
  for (const p of arco){
    p.t += p.s*vel; if (p.t>1) p.t -= 1;
    const [x,y] = curva(p.t); const esp = (40+anima.nivel*60)*DPR;
    const px = x + p.o*esp*Math.sin(p.t*9+p.f), py = y + p.o*esp;
    const a = Math.sin(p.t*Math.PI) * (.45 + .55*Math.abs(Math.sin(tempo*1.7+p.f)));
    cx.globalAlpha = a; cx.fillStyle = `rgb(${R},${G},${B})`;
    cx.beginPath(); cx.arc(px, py, p.r*(1+anima.nivel*.8), 0, 6.283); cx.fill();
  }
  // rastro de cometa e brilho do cursor
  if (mouse.on){
    rastro.push([mouse.x, mouse.y]); if (rastro.length > 18) rastro.shift();
    rastro.forEach(([x,y],i)=>{ const q=i/rastro.length; cx.globalAlpha=q*.5; cx.fillStyle=`rgb(${R},${G},${B})`; cx.beginPath(); cx.arc(x,y,(1+q*2.5)*DPR,0,6.283); cx.fill(); });
    const cg = cx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,120*DPR);
    cg.addColorStop(0,`rgba(${R},${G},${B},.10)`); cg.addColorStop(1,'rgba(0,0,0,0)'); cx.globalAlpha=1; cx.fillStyle=cg; cx.fillRect(mouse.x-120*DPR,mouse.y-120*DPR,240*DPR,240*DPR);
  } else rastro.length = 0;
  // faíscas do clique
  for (let i=faiscas.length-1;i>=0;i--){ const p=faiscas[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=.04*DPR; p.vx*=.98; p.vy*=.98; p.vida-=.018;
    if (p.vida<=0){ faiscas.splice(i,1); continue; } cx.globalAlpha=p.vida; cx.fillStyle=p.cor; cx.beginPath(); cx.arc(p.x,p.y,p.r*p.vida,0,6.283); cx.fill(); }
  // esfera de luz: respira parada, pulsa com a voz, ondas quando ouve, segue o mouse de leve, cresce no hover
  const ox = W*.5 + Math.sin(tempo*.3)*W*.01 + (mouse.on ? (mouse.x-W*.5)*.03 : 0);
  const oy = H*.19 + Math.cos(tempo*.4)*H*.006 + (mouse.on ? (mouse.y-H*.19)*.02 : 0);
  const base = Math.min(W,H)*.045;
  orbe.x = ox; orbe.y = oy; orbe.r = base*1.6;
  const sobre = mouse.on && Math.hypot(mouse.x-ox, mouse.y-oy) < orbe.r;
  if (sobre !== orbe.sobre){ orbe.sobre = sobre; document.body.style.cursor = sobre ? 'pointer' : ''; $('dica').classList.toggle('mostra', sobre); }
  orbe.zoom += ((sobre?1.25:1) - orbe.zoom)*.12;
  const raio = base*orbe.zoom*(1 + .08*Math.sin(tempo*1.6) + anima.nivel*.9);
  cx.globalAlpha = 1;
  const halo = cx.createRadialGradient(ox,oy,0,ox,oy,raio*5);
  halo.addColorStop(0,`rgba(${R},${G},${B},.55)`); halo.addColorStop(.25,`rgba(${R},${G},${B},.18)`); halo.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle = halo; cx.beginPath(); cx.arc(ox,oy,raio*5,0,6.283); cx.fill();
  const nucleo = cx.createRadialGradient(ox-raio*.25,oy-raio*.25,0,ox,oy,raio);
  nucleo.addColorStop(0,'#fffaf0'); nucleo.addColorStop(.7,`rgb(${R},${G},${B})`); nucleo.addColorStop(1,`rgba(${R},${G},${B},.6)`);
  cx.fillStyle = nucleo; cx.beginPath(); cx.arc(ox,oy,raio,0,6.283); cx.fill();
  // faixas coloridas girando dentro da esfera (estilo Siri) — fortes quando fala, sutis em repouso
  cx.save(); cx.beginPath(); cx.arc(ox,oy,raio*.97,0,6.283); cx.clip(); cx.globalCompositeOperation='screen';
  const fitas = [[255,120,200],[100,175,255],[90,235,220]];
  fitas.forEach(([r,g,b],i)=>{ const ang = tempo*(.5+i*.3) + i*2.1;
    cx.globalAlpha = .10 + anima.nivel*.45 + (orbe.sobre?.12:0);
    cx.strokeStyle = `rgb(${r},${g},${b})`; cx.lineWidth = raio*(.10+anima.nivel*.10); cx.beginPath();
    cx.ellipse(ox, oy, raio*.78, raio*(.22+.10*Math.sin(tempo*1.8+i)), ang, 0, 6.283); cx.stroke(); });
  cx.restore(); cx.globalCompositeOperation='source-over';
  if (anima.modo === 'ouvindo'){
    for (let i=0;i<3;i++){ const f = ((tempo*.8 + i/3) % 1);
      cx.globalAlpha = (1-f)*.6; cx.strokeStyle = `rgb(${R},${G},${B})`; cx.lineWidth = 1.5*DPR;
      cx.beginPath(); cx.arc(ox,oy,raio*(1.2+f*3+anima.nivel*2),0,6.283); cx.stroke(); }
  }
  cx.globalAlpha = 1;
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);

function estado(texto, modo){ const e=$('estado'); e.textContent=texto; e.className='estado '+(modo||''); anima.modo = modo==='cmd'?'cmd':(modo||'calmo'); }
function chip(id, cls, txt){ const c=$(id); c.className='chip '+(cls||''); if(txt) c.lastChild.textContent=txt; }

/* ---------------- últimos avisos ---------------- */
function aviso(a){
  const el = document.createElement('div'); el.className = 'aviso' + (a.urgente?' urg':'');
  const ic = document.createElement('span'); ic.className='ic'; ic.textContent = a.canal==='email'?'✉️':a.canal==='lembrete'?'⏰':'💬';
  const meio = document.createElement('div');
  const q = document.createElement('div'); q.className='q'; q.textContent = a.de + (a.grupo?' · '+a.grupo:'');
  const r = document.createElement('div'); r.className='r'; r.textContent = a.resumo || '🔒 mensagem privada';
  meio.append(q, r);
  const h = document.createElement('span'); h.className='h'; h.textContent = a.hora;
  el.append(ic, meio, h);
  el.title = 'Clique para ver o texto inteiro';
  el.addEventListener('click', () => el.classList.toggle('aberto'));
  const l = $('lista'); l.prepend(el); while (l.children.length > 3) l.lastChild.remove();
}
// holofote dos cartões: posição do cursor dentro de cada cartão
$('lista').addEventListener('pointermove', e => {
  for (const c of $('lista').children){ const r=c.getBoundingClientRect(); c.style.setProperty('--x',(e.clientX-r.left)+'px'); c.style.setProperty('--y',(e.clientY-r.top)+'px'); }
});

/* ---------------- botões: magnéticos, "Responder" e "Até amanhã" (segurar) ---------------- */
function comando(c, t){ fetch('/comando?k='+k+'&c='+c+'&t='+encodeURIComponent(t||''),{method:'POST'}).catch(()=>{}); }
addEventListener('pointermove', e => {
  for (const b of document.querySelectorAll('.mag')){
    const r=b.getBoundingClientRect(), dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2), d=Math.hypot(dx,dy);
    // puxão sutil: no máximo 6 px, e só quando o cursor está bem perto
    const cl = (v) => Math.max(-6, Math.min(6, v));
    b.style.transform = d < 90 ? `translate(${cl(dx*.12)}px,${cl(dy*.15)}px)` : '';
  }
});
$('bResp').addEventListener('click', e => {
  const r=e.currentTarget.getBoundingClientRect(); explodir((r.left+r.width/2)*DPR,(r.top)*DPR,30,['#7cc4ff','#fff']);
  estado('Respondendo a última mensagem…','cmd'); comando('responda','responda');
});
(() => { // segurar 1,4 s para confirmar o desligamento (soltar antes cancela)
  const b=$('bTchau'); let t0=0, raf=0;
  const parar = () => { cancelAnimationFrame(raf); t0=0; if(!b.classList.contains('feito')) b.style.setProperty('--p',0); };
  const passo = (ms) => { const p=Math.min(1,(ms-t0)/1400); b.style.setProperty('--p',p);
    if (p>=1){ b.classList.add('feito'); const r=b.getBoundingClientRect(); explodir((r.left+r.width/2)*DPR,r.top*DPR,80,['#ffd9a0','#6fe3a5','#fff']);
      estado('Até amanhã, '+(NOME||'')+'! Desligando o PC…','cmd'); comando('ate-amanha','até amanhã (botão)');
      setTimeout(()=>{ b.classList.remove('feito'); b.style.setProperty('--p',0); },4000); return; }
    raf=requestAnimationFrame(passo); };
  b.addEventListener('pointerdown', e => { e.preventDefault(); t0=performance.now(); raf=requestAnimationFrame(passo); });
  for (const ev of ['pointerup','pointerleave','pointercancel']) b.addEventListener(ev, parar);
})();
// relógio mostra os segundos enquanto o mouse está em cima
(() => { let it=0; const h=$('hora');
  h.addEventListener('mouseenter', () => { const f=()=>{ h.textContent=new Date().toLocaleTimeString('pt-BR'); }; f(); it=setInterval(f,1000); });
  h.addEventListener('mouseleave', () => { clearInterval(it); relogio(); });
})();

$('cConex').title='Ligação com o PC (Vigia)'; $('cMic').title='Microfone deste notebook para o "responda"'; $('cCmd').title='Comandos de voz: "envia mensagem para …", "me lembra às … de …", "responda", "até amanhã", "cancela"';

/* ---------------- áudio (falas do Vigia) ---------------- */
let actx = null;
function contexto(){ if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
let fila = Promise.resolve(); let micOk = false;
// Modo música: lembrado entre recarregamentos (se o navegador permitir guardar)
let musica = false; try { musica = localStorage.getItem('vigia-musica') === '1'; } catch(e) {}
// "plim" de dois tons antes da fala, para chamar atenção por cima da música
function plim(){ return new Promise(ok => { try { const ac=contexto(), t=ac.currentTime;
  [[1046,0],[1568,.13]].forEach(([f,d])=>{ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=f; o.type='sine';
    g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(.35,t+d+.02); g.gain.exponentialRampToValueAtTime(.001,t+d+.35);
    o.connect(g); g.connect(ac.destination); o.start(t+d); o.stop(t+d+.4); });
  setTimeout(ok, 480); } catch(e) { ok(); } }); }
function tocar(id){ fila = fila.then(() => new Promise(async r => {
  pausar(); estado('Falando…','falando');
  if (musica) await plim();
  const a = new Audio('/audio/'+id+'?k='+k); a.crossOrigin='anonymous';
  let medir = null;
  try { // mede o volume da fala para a esfera pulsar; no modo música, aumenta o volume (com compressor para não distorcer)
    const ac = contexto(), src = ac.createMediaElementSource(a), an = ac.createAnalyser(); an.fftSize = 512;
    const ganho = ac.createGain(); ganho.gain.value = musica ? 2.2 : 1;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -10; comp.ratio.value = 6;
    src.connect(ganho); ganho.connect(comp); comp.connect(an); an.connect(ac.destination); const buf = new Uint8Array(an.fftSize);
    medir = setInterval(()=>{ an.getByteTimeDomainData(buf); let s=0; for(const v of buf){const x=(v-128)/128; s+=x*x;} anima.alvo = Math.min(1, Math.sqrt(s/buf.length)*5); }, 50);
  } catch(e) {}
  const fim = () => { clearInterval(medir); anima.alvo = 0; estado('Esperando mensagens…'); fetch('/tocado/'+id+'?k='+k,{method:'POST'}).catch(()=>{}); retomar(); r(); };
  a.onended = fim; a.onerror = fim; a.play().catch(fim);
})); }

/* ---------------- gravação (quando o Vigia pede para ouvir) ---------------- */
function wav16(quadros, rate){ let total=0; for(const q of quadros) total+=q.length; const src=new Float32Array(total); let o=0; for(const q of quadros){src.set(q,o);o+=q.length;}
  const r=rate/16000, n=Math.floor(src.length/r), buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
  const w=(p,s)=>{for(let i=0;i<s.length;i++)v.setUint8(p+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const x=Math.max(-1,Math.min(1,src[Math.floor(i*r)]));v.setInt16(44+i*2,x*32767,true);} return new Blob([buf],{type:'audio/wav'}); }
function enviarFala(id, blob){ fetch('/fala/'+id+'?k='+k,{method:'POST',body:blob||new Blob([])}).catch(()=>{}); }
function ouvir(p){ fila = fila.then(async()=>{ pausar(); try { await ouvirAgora(p); } finally { retomar(); } }); }
async function ouvirAgora(p){
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
  catch(e){ chip('cMic','mal','Microfone bloqueado'); return enviarFala(p.id,null); }
  const ac = new AudioContext(); await ac.resume();
  const os=ac.createOscillator(), g=ac.createGain(); os.frequency.value=880; g.gain.setValueAtTime(.25,ac.currentTime); g.gain.linearRampToValueAtTime(0,ac.currentTime+.15); os.connect(g); g.connect(ac.destination); os.start(); os.stop(ac.currentTime+.16);
  const src=ac.createMediaStreamSource(stream), proc=ac.createScriptProcessor(4096,1,1), mudo=ac.createGain(); mudo.gain.value=0; src.connect(proc); proc.connect(mudo); mudo.connect(ac.destination);
  const rate=ac.sampleRate, Q=Math.round(rate*.1);
  let acum=new Float32Array(0), quadros=[], n=0, ruido=[], limiar=null, falando=false, ini=-1, sil=0, seg=0, acabou=false;
  estado('Ouvindo você…','ouvindo'); chip('cMic','ouvindo','Ouvindo');
  await new Promise(res=>{
    const fim=(ok)=>{ if(acabou) return; acabou=true; clearTimeout(t); proc.onaudioprocess=null; try{proc.disconnect();src.disconnect();}catch(e){}
      stream.getTracks().forEach(x=>x.stop()); ac.close(); anima.alvo=0; estado('Esperando mensagens…'); chip('cMic','ok','Microfone');
      enviarFala(p.id, ok ? wav16(quadros.slice(Math.max(0,ini-3)),rate) : null); res(); };
    const t=setTimeout(()=>fim(falando), p.esperaMs+p.maxMs+2000);
    proc.onaudioprocess=e=>{ if(acabou) return; const d=e.inputBuffer.getChannelData(0); const a=new Float32Array(acum.length+d.length); a.set(acum); a.set(d,acum.length); acum=a;
      while(acum.length>=Q && !acabou){ const q=acum.slice(0,Q); acum=acum.slice(Q); quadros.push(q); n++;
        let s=0; for(let i=0;i<q.length;i++) s+=q[i]*q[i]; const rms=Math.sqrt(s/q.length), db=20*Math.log10(rms+1e-9);
        anima.alvo = Math.min(1, rms*8);
        if(n<=3) continue;
        if(n<=6){ ruido.push(db); if(n===6){
          if (musica){ // com música: a voz precisa ficar ~9 dB acima do som da música
            const med=[...ruido].sort((x,y)=>x-y)[Math.floor(ruido.length/2)]; limiar=Math.min(-15,Math.max(-50,med+9));
          } else { const piso=Math.min(...ruido); limiar=Math.min(-45,Math.max(-55,piso+12)); } } continue; }
        if(!falando){ seg=db>limiar?seg+1:0; if(seg>=2){falando=true; ini=Math.max(4,n-2);} else if(n*100>p.esperaMs+700) return fim(false); }
        else { sil=db>limiar?0:sil+100; if(sil>=p.silencioMs || (n-ini)*100>=p.maxMs) return fim(true); } } };
  });
}

/* ---------------- comandos de voz contínuos ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, pausa=0, recAtivo=false;
function pausar(){ pausa++; try{ rec && rec.abort(); }catch(e){} }
function retomar(){ pausa=Math.max(0,pausa-1); if(!pausa) setTimeout(ligarRec,300); }
function ligarRec(){ if(!rec||pausa||recAtivo||musica) return; try{ rec.start(); recAtivo=true; }catch(e){} }
function aplicarMusica(){
  const b=$('bMusica'); b.classList.toggle('on', musica); b.firstChild.textContent = musica ? '🎵 Modo música: ligado' : '🎵 Modo música';
  if (!rec) return;
  if (musica){ try{ rec.abort(); }catch(e){} chip('cCmd','musica','Comandos pausados (música)'); }
  else { chip('cCmd','ok','Comandos'); ligarRec(); }
}
function setMusica(v){ musica=v; try{ localStorage.setItem('vigia-musica', v?'1':'0'); }catch(e){} aplicarMusica();
  estado(v ? 'Modo música ligado: comandos de voz pausados' : 'Modo música desligado: ouvindo comandos de novo','cmd');
  setTimeout(()=>{ if(anima.modo==='cmd') estado('Esperando mensagens…'); },3500); }
function iniciarComandos(){
  if(!SR || !micOk){ chip('cCmd','mal','Comandos indisponíveis'); return; }
  rec=new SR(); rec.lang='pt-BR'; rec.continuous=true; rec.interimResults=false;
  rec.onend=()=>{ recAtivo=false; if(!pausa) setTimeout(ligarRec,400); };
  rec.onerror=e=>{ recAtivo=false; if(e.error==='not-allowed'||e.error==='service-not-allowed'){ chip('cCmd','mal','Comandos bloqueados'); rec=null; } };
  rec.onresult=e=>{ for(let i=e.resultIndex;i<e.results.length;i++){ if(!e.results[i].isFinal) continue;
    const t=e.results[i][0].transcript.trim(); const s=t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); let c=null;
    // "até amanhã" e "cancela" só valem como frase curta (até 4 palavras), nunca no meio de uma conversa
    const curta = s.split(/\s+/).filter(Boolean).length <= 4;
    if(/^\W*(envia|envie|enviar|manda|mande|mandar)\b.*\bmensage/.test(s)) c='enviar';
    else if(/^\W*(me\s+)?(lembra|lembre|lembrar|cria um lembrete|criar lembrete|lembrete)\b/.test(s)) c='lembrete';
    else if(curta && /\bate amanha\b/.test(s)) c='ate-amanha'; else if(curta && /\bcancel/.test(s)) c='cancela'; else if(curta && /\brespond/.test(s)) c='responda';
    if(c){ estado('“'+t+'”','cmd'); setTimeout(()=>{ if(anima.modo==='cmd') estado('Esperando mensagens…'); },4000);
      fetch('/comando?k='+k+'&c='+c+'&t='+encodeURIComponent(t),{method:'POST'}).catch(()=>{}); } } };
  chip('cCmd','ok','Comandos'); aplicarMusica(); ligarRec();
}
$('bMusica').addEventListener('click', e => {
  const r=e.currentTarget.getBoundingClientRect(); explodir((r.left+r.width/2)*DPR, r.top*DPR, 34, ['#c79bff','#7cc4ff','#fff']);
  setMusica(!musica);
});
aplicarMusica();

/* ---------------- abertura ---------------- */
$('b').onclick = async () => {
  try { await contexto().resume(); } catch(e) {}
  new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=').play().catch(()=>{});
  $('abrir').classList.add('some');
  if (window.isSecureContext && navigator.mediaDevices){
    try { const s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(x=>x.stop()); micOk=true; chip('cMic','ok','Microfone'); }
    catch(e){ chip('cMic','mal','Microfone não liberado'); }
  } else chip('cMic','mal','Microfone precisa da liberação no navegador');
  const es = new EventSource('/eventos?k='+k+'&mic='+(micOk?1:0));
  es.onopen = ()=> chip('cConex','ok','PC conectado');
  es.onerror = ()=> chip('cConex','mal','Reconectando ao PC…');
  es.addEventListener('tocar', e=>tocar(e.data));
  es.addEventListener('ouvir', e=>ouvir(JSON.parse(e.data)));
  es.addEventListener('aviso', e=>aviso(JSON.parse(e.data)));
  es.addEventListener('config', e=>{ const c=JSON.parse(e.data); if('nome' in c){ NOME=c.nome; relogio(); } });
  iniciarComandos();
};
